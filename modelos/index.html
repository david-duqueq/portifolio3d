<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#121214">
  <meta name="description" content="Explore e baixe os modelos 3D de David Duque.">
  <title>Modelos 3D — David Duque</title>
  <link rel="icon" type="image/png" href="../DKB.png">
  <link rel="apple-touch-icon" href="../DKB.png">
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    :root { color-scheme: dark; --bg: #121214; --card: #1e1e24; --accent: #2ee86f; --text: #f4f4f6; --muted: #a0a0ab; --border: #2a2a32; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.55; }
    body.viewer-full { overflow: hidden; }
    header { padding: 2.5rem 1rem 2rem; text-align: center; background: linear-gradient(180deg, #1a1a22, var(--bg)); border-bottom: 1px solid var(--border); }
    header a { color: var(--accent); text-decoration: none; font-weight: 600; }
    header a:hover { text-decoration: underline; }
    h1 { margin: 0 0 .4rem; font-size: clamp(2rem, 5vw, 3rem); }
    header p { margin: 0 0 .5rem; color: var(--muted); }
    main { width: min(1200px, 100%); margin: auto; padding: 2rem 1rem; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: .75rem; margin-bottom: 1.25rem; color: var(--muted); }
    .toolbar input { width: min(100%, 340px); padding: .7rem .9rem; border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--text); font: inherit; }
    .toolbar input:focus-visible, a:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 1.25rem; }
    .card { min-width: 0; overflow: hidden; display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: 12px; background: var(--card); }
    .preview { position: relative; height: 250px; background: #16161b; }
    .preview model-viewer { width: 100%; height: 100%; --poster-color: transparent; --progress-bar-color: var(--accent); }
    .viewer-tools { position: absolute; z-index: 1; top: .6rem; right: .6rem; display: flex; flex-direction: column; gap: .4rem; }
    .viewer-tools button { width: 36px; height: 36px; border: 1px solid #44444f; border-radius: 8px; background: #1e1e24e8; color: var(--text); font: inherit; font-size: 1.2rem; cursor: pointer; }
    .viewer-tools button:hover, .viewer-tools button[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
    .preview-note { position: absolute; z-index: 2; inset: 0; display: grid; place-items: center; padding: 1rem; color: var(--muted); text-align: center; background: #16161b; }
    .preview-note[hidden] { display: none; }
    .details { display: flex; flex: 1; flex-direction: column; align-items: flex-start; padding: 1rem; }
    h2 { overflow-wrap: anywhere; margin: 0 0 .35rem; font-size: 1rem; }
    .meta { margin: 0 0 1rem; color: var(--muted); font-size: .82rem; }
    .download { display: inline-block; margin-top: auto; padding: .65rem .9rem; border-radius: 7px; background: var(--accent); color: #07110a; font-weight: 750; text-decoration: none; }
    .download:hover { filter: brightness(.9); }
    .message { padding: 2rem 1rem; color: var(--muted); text-align: center; }
    footer { padding: 2rem 1rem; color: var(--muted); text-align: center; font-size: .9rem; }
    .preview.is-full { position: fixed; inset: 0; z-index: 9000; width: 100%; height: 100%; }
    .pager { display: flex; flex-wrap: wrap; justify-content: center; gap: .4rem; margin: 1.75rem 0 .5rem; }
    .pager[hidden] { display: none; }
    .pager button { min-width: 44px; height: 44px; padding: 0 .85rem; border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--text); font: inherit; font-size: 1rem; cursor: pointer; touch-action: manipulation; }
    .pager button:hover:not(:disabled) { color: var(--accent); border-color: var(--accent); }
    .pager button[aria-current="page"] { background: var(--accent); border-color: var(--accent); color: #07110a; font-weight: 700; }
    .pager button:disabled { opacity: .4; cursor: default; }
    .pager .gap { align-self: center; padding: 0 .15rem; color: var(--muted); }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <header>
    <h1>Modelos 3D</h1>
    <p>Visualize e baixe os modelos disponíveis.</p>
    <p><a href="../">&larr; Voltar ao portfólio</a></p>
  </header>
  <main>
    <div class="toolbar">
      <span id="count" aria-live="polite">Carregando modelos…</span>
      <label><span hidden>Buscar modelo</span><input id="search" type="search" placeholder="Buscar modelo…" aria-label="Buscar modelo"></label>
    </div>
    <section class="grid" id="models" aria-label="Modelos disponíveis"></section>
    <nav class="pager" id="pager" aria-label="Páginas de modelos" hidden></nav>
    <p class="message" id="message" role="status"></p>
  </main>
  <footer>Os arquivos são carregados diretamente deste repositório. Modelos GLB podem ser visualizados em 3D; outros formatos ficam disponíveis para download.</footer>
  <script>
    (() => {
      const folderApi = 'https://api.github.com/repos/david-duqueq/portifolio3d/contents/modelos';
      const PAGE_SIZE_PHONE = 4; // quantos modelos por página no celular/tablet (no computador mostra todos)
      const grid = document.querySelector('#models');
      const count = document.querySelector('#count');
      const message = document.querySelector('#message');
      const search = document.querySelector('#search');
      const pager = document.querySelector('#pager');
      const phoneQuery = window.matchMedia('(max-width: 700px), (pointer: coarse)');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let allFiles = [];
      let page = 1;
      let observer = null;
      let searchTimer = null;

      const formatSize = bytes => bytes < 1024 * 1024
        ? `${(bytes / 1024).toFixed(0)} KB`
        : `${(bytes / (1024 * 1024)).toFixed(1)} MB`;

      const formatTitle = filename => filename
        .replace(/\.(glb|fbx)$/i, '')
        .replace(/_DKB$/i, '')
        .replace(/_/g, ' ');

      function makeCard(file) {
        const extension = file.name.split('.').pop().toLowerCase();
        const canPreview = extension === 'glb';
        const cleanTitle = formatTitle(file.name);
        const card = document.createElement('article');
        card.className = 'card';

        if (canPreview) {
          const preview = document.createElement('div');
          preview.className = 'preview';
          const viewer = document.createElement('model-viewer');
          viewer.setAttribute('alt', `Visualização 3D de ${cleanTitle}`);
          viewer.setAttribute('camera-controls', '');
          if (!reducedMotion) viewer.setAttribute('auto-rotate', '');
          viewer.setAttribute('loading', 'lazy');
          viewer.setAttribute('touch-action', 'pan-y');
          viewer.setAttribute('shadow-intensity', '1');
          viewer.setAttribute('environment-image', 'neutral');
          viewer.setAttribute('interaction-prompt', 'none');
          viewer.dataset.src = file.download_url;

          const tools = document.createElement('div');
          tools.className = 'viewer-tools';
          const actions = [
            ['zoom-in', 'Aproximar', '+'],
            ['zoom-out', 'Afastar', '−'],
            ['reset', 'Voltar à posição inicial', '↺'],
            ['spin', 'Alternar giro automático', '⟳'],
            ['full', 'Tela cheia', '⛶']
          ];
          actions.forEach(([action, label, icon]) => {
            const button = document.createElement('button');
            button.type = 'button';
            button.dataset.act = action;
            button.title = label;
            button.setAttribute('aria-label', label);
            if (action === 'spin') {
              button.setAttribute('aria-pressed', String(!reducedMotion));
              if (!reducedMotion) button.classList.add('on');
            }
            button.textContent = icon;
            tools.append(button);
          });

          const note = document.createElement('div');
          note.className = 'preview-note';
          note.textContent = 'Carregando visualização 3D…';
          viewer.addEventListener('load', () => { note.hidden = true; });
          viewer.addEventListener('error', () => { note.textContent = 'Pré-visualização indisponível. O arquivo ainda pode ser baixado.'; });
          tools.addEventListener('click', event => {
            const button = event.target.closest('button');
            if (!button) return;
            const action = button.dataset.act;
            if (action === 'zoom-in' || action === 'zoom-out') {
              if (!viewer.loaded) return;
              const orbit = viewer.getCameraOrbit();
              const factor = action === 'zoom-in' ? 0.8 : 1.25;
              viewer.cameraOrbit = `${orbit.theta}rad ${orbit.phi}rad ${orbit.radius * factor}m`;
            } else if (action === 'reset') {
              viewer.cameraOrbit = 'auto auto auto';
              viewer.cameraTarget = 'auto auto auto';
              viewer.fieldOfView = 'auto';
            } else if (action === 'spin') {
              const spinning = !viewer.hasAttribute('auto-rotate');
              viewer.toggleAttribute('auto-rotate', spinning);
              button.setAttribute('aria-pressed', String(spinning));
              button.classList.toggle('on', spinning);
            } else if (action === 'full') {
              const fullscreen = preview.classList.toggle('is-full');
              document.body.classList.toggle('viewer-full', fullscreen);
              viewer.setAttribute('touch-action', fullscreen ? 'none' : 'pan-y');
            }
          });
          preview.append(viewer, tools, note);
          card.append(preview);
        }

        const details = document.createElement('div');
        details.className = 'details';
        const title = document.createElement('h2');
        title.textContent = cleanTitle;
        const meta = document.createElement('p');
        meta.className = 'meta';
        meta.textContent = `${extension.toUpperCase()} · ${formatSize(file.size)}${canPreview ? ' · Visualização 3D' : ' · Download'}`;
        const link = document.createElement('a');
        link.className = 'download';
        link.href = file.download_url;
        link.download = file.name;
        link.rel = 'noopener';
        link.textContent = 'Baixar arquivo';
        details.append(title, meta, link);
        card.append(details);
        return card;
      }

      // Só os modelos visíveis (e perto da tela) começam a baixar
      function observeViewers() {
        if (observer) observer.disconnect();
        const viewers = grid.querySelectorAll('model-viewer');
        if (!('IntersectionObserver' in window)) {
          viewers.forEach(viewer => viewer.setAttribute('src', viewer.dataset.src));
          return;
        }
        observer = new IntersectionObserver(entries => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              const viewer = entry.target;
              viewer.setAttribute('src', viewer.dataset.src);
              observer.unobserve(viewer);
            }
          });
        }, { rootMargin: phoneQuery.matches ? '80px' : '250px' });
        viewers.forEach(viewer => observer.observe(viewer));
      }

      // Lista de páginas com reticências: 1 … 4 5 6 … 12
      function pageList(total, current) {
        const wanted = new Set([1, total, current - 1, current, current + 1]);
        const nums = [...wanted].filter(n => n >= 1 && n <= total).sort((a, b) => a - b);
        const out = [];
        nums.forEach((n, i) => {
          if (i && n - nums[i - 1] > 1) out.push('…');
          out.push(n);
        });
        return out;
      }

      function renderPager(pages) {
        pager.textContent = '';
        if (pages <= 1) { pager.hidden = true; return; }
        pager.hidden = false;
        const add = (label, target, options = {}) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.textContent = label;
          button.dataset.page = target;
          button.setAttribute('aria-label', options.aria);
          if (options.disabled) button.disabled = true;
          if (options.current) button.setAttribute('aria-current', 'page');
          pager.append(button);
        };
        add('‹', page - 1, { disabled: page === 1, aria: 'Página anterior' });
        pageList(pages, page).forEach(n => {
          if (n === '…') {
            const gap = document.createElement('span');
            gap.className = 'gap';
            gap.textContent = '…';
            pager.append(gap);
          } else {
            add(String(n), n, { current: n === page, aria: `Página ${n}` });
          }
        });
        add('›', page + 1, { disabled: page === pages, aria: 'Próxima página' });
      }

      // Desenha só a página atual (no celular); os outros modelos nem chegam a ser criados
      function render(options = {}) {
        const term = search.value.trim().toLocaleLowerCase('pt-BR');
        const list = allFiles.filter(file => file.key.includes(term));
        const size = phoneQuery.matches ? PAGE_SIZE_PHONE : Infinity;
        const pages = size === Infinity ? 1 : Math.max(1, Math.ceil(list.length / size));
        page = Math.min(Math.max(page, 1), pages);
        const slice = size === Infinity ? list : list.slice((page - 1) * size, page * size);

        grid.querySelectorAll('model-viewer').forEach(viewer => viewer.removeAttribute('src'));
        grid.textContent = '';
        document.body.classList.remove('viewer-full');
        slice.forEach(file => grid.append(makeCard(file)));
        observeViewers();
        renderPager(pages);

        count.textContent = `${list.length} de ${allFiles.length} modelos` + (pages > 1 ? ` · página ${page} de ${pages}` : '');
        message.textContent = allFiles.length && !list.length ? 'Nenhum modelo corresponde à busca.' : '';
        if (options.scroll) grid.scrollIntoView({ behavior: reducedMotion ? 'auto' : 'smooth', block: 'start' });
      }

      pager.addEventListener('click', event => {
        const button = event.target.closest('button');
        if (!button || button.disabled) return;
        page = Number(button.dataset.page);
        render({ scroll: true });
      });

      document.addEventListener('keydown', event => {
        if (event.key === 'Escape') {
          const fullscreen = document.querySelector('.preview.is-full');
          if (fullscreen) {
            fullscreen.classList.remove('is-full');
            document.body.classList.remove('viewer-full');
            fullscreen.querySelector('model-viewer').setAttribute('touch-action', 'pan-y');
          }
        }
      });

      search.addEventListener('input', () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => { page = 1; render(); }, 250);
      });

      const onLayoutChange = () => { page = 1; if (allFiles.length) render(); };
      if (phoneQuery.addEventListener) phoneQuery.addEventListener('change', onLayoutChange);
      else if (phoneQuery.addListener) phoneQuery.addListener(onLayoutChange);

      fetch(folderApi, { headers: { Accept: 'application/vnd.github+json' } })
        .then(response => {
          if (!response.ok) throw new Error(`GitHub API respondeu ${response.status}`);
          return response.json();
        })
        .then(files => {
          allFiles = files
            .filter(file => file.type === 'file' && /\.(glb|fbx)$/i.test(file.name))
            .sort((a, b) => a.name.localeCompare(b.name, 'pt-BR'))
            .map(file => ({ ...file, key: `${formatTitle(file.name)} ${file.name}`.toLocaleLowerCase('pt-BR') }));
          if (!allFiles.length) throw new Error('Nenhum arquivo GLB ou FBX foi encontrado na pasta modelos.');
          render();
        })
        .catch(error => {
          count.textContent = 'Não foi possível carregar a lista de modelos.';
          message.textContent = `${error.message}. Tente novamente mais tarde.`;
        });
    })();
  </script>
</body>
</html>
